<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Disarm PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="display" class="lcd-display">
        Timer: 10:00 | Status: Disarmed | Code: 000000<br>
        Entered Code: <span id="enteredCodeDisplay">-</span>
    </div>

    <div id="keypadContainer">
        <div id="keypad">
            <button class="key">0</button>
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key delete">Delete</button>
        </div>
    </div>

    <div id="controls">
        <button id="disarmButton" class="control-button disarm">Disarm</button>
        <button id="armButton" class="control-button arm">Arm</button>
    </div>

    <button id="settingsButton" class="settings">Settings</button>

    <div id="settingsMenu" class="menu hidden">
        <label for="timer">Timer Intervals:</label>
        <select id="timer">
            <option value="90">1.5 minutes</option>
            <option value="180">3 minutes</option>
            <option value="270">4.5 minutes</option>
        </select>
        <label for="sound">Finish Sound:</label>
        <select id="sound">
            <option value="beep">Beep</option>
            <option value="alarm">Alarm</option>
            <option value="chime">Chime</option>
        </select>
    </div>

    <script src="script.js"></script>
</body>
</html>
