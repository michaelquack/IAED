<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="display">
            <div id="timerDisplay">00:00</div>
            <div id="inputDisplay">Input: </div>
            <div id="statusDisplay">Status: Disarm</div>
            <div id="codeDisplay">Disarm Code: ------</div>
        </div>
        <div class="keypad">
            <div class="button" onclick="enterNumber(1)">1</div>
            <div class="button" onclick="enterNumber(2)">2</div>
            <div class="button" onclick="enterNumber(3)">3</div>
            <div class="button" onclick="enterNumber(4)">4</div>
            <div class="button" onclick="enterNumber(5)">5</div>
            <div class="button" onclick="enterNumber(6)">6</div>
            <div class="button" onclick="enterNumber(7)">7</div>
            <div class="button" onclick="enterNumber(8)">8</div>
            <div class="button" onclick="enterNumber(9)">9</div>
            <div class="button" onclick="enterNumber(0)">0</div>
            <div class="button delete" onclick="clearInput()">Delete</div>
        </div>
        <button id="armButton" onclick="toggleArm()" class="arm-button">Arm</button>
        <button id="settingsButton" onclick="openSettings()">Settings</button>
    </div>
    <div id="settingsMenu" class="settings-menu" style="display: none;">
        <h2>Settings</h2>
        <label for="timerInterval">Timer Interval:</label>
        <select id="timerInterval">
            <option value="90">1.5 Minutes</option>
            <option value="180">3 Minutes</option>
            <option value="270">4.5 Minutes</option>
        </select>
        <button onclick="closeSettings()">Close</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
