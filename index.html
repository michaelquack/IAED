<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I.A.E.D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="display-container">
      <div id="display">
        <p id="time-display">00:00</p>
        <p id="status">Status: Disarm</p>
        <p id="code-display">Code: </p>
        <p id="typed-display">Typed: </p>
      </div>
    </div>
    
    <div id="keypad-frame">
      <div id="keypad">
        <!-- Keypad buttons 0-9 and delete -->
        <button class="key" onclick="typeKey('1')">1</button>
        <button class="key" onclick="typeKey('2')">2</button>
        <button class="key" onclick="typeKey('3')">3</button>
        <button class="key" onclick="typeKey('4')">4</button>
        <button class="key" onclick="typeKey('5')">5</button>
        <button class="key" onclick="typeKey('6')">6</button>
        <button class="key" onclick="typeKey('7')">7</button>
        <button class="key" onclick="typeKey('8')">8</button>
        <button class="key" onclick="typeKey('9')">9</button>
        <button class="key" onclick="typeKey('0')">0</button>
        <button class="key" onclick="deleteKey()">Del</button>
      </div>
    </div>
    
    <div id="controls">
      <button id="arm-btn" onclick="toggleArm()">Arm</button>
      <button id="settings-btn" onclick="openSettings()">Settings</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h2>Settings</h2>
      <label>Timer Interval:</label>
      <select id="timer-interval">
        <option value="90">1.5 minutes</option>
        <option value="180">3 minutes</option>
        <option value="270">4.5 minutes</option>
      </select>
      <label>Sound:</label>
      <select id="sound-option">
        <option value="beep">Beep</option>
        <option value="buzz">Buzz</option>
        <option value="explosion">Explosion</option>
      </select>
      <button onclick="closeSettings()">Close</button>
    </div>
  </div>

  <audio id="explosion-sound" src="explosion-42132.mp3"></audio>
  
  <script src="script.js"></script>
</body>
</html>
