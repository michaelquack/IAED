<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bomb Defusal Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="display">
    <div class="lcd">
      <p id="time-remaining">00:00</p>
      <p id="status">DISARM</p>
      <p id="disarm-code">123456</p>
      <p id="typed-input"></p>
    </div>
  </div>

  <div class="keypad-frame">
    <div class="keypad">
      <!-- Number buttons 0-9 -->
      <button onclick="handleKeypadClick(1)">1</button>
      <button onclick="handleKeypadClick(2)">2</button>
      <button onclick="handleKeypadClick(3)">3</button>
      <button onclick="handleKeypadClick(4)">4</button>
      <button onclick="handleKeypadClick(5)">5</button>
      <button onclick="handleKeypadClick(6)">6</button>
      <button onclick="handleKeypadClick(7)">7</button>
      <button onclick="handleKeypadClick(8)">8</button>
      <button onclick="handleKeypadClick(9)">9</button>
      <button onclick="handleKeypadClick(0)">0</button>
      <button onclick="handleKeypadClick('delete')">Delete</button>
    </div>
  </div>

  <div class="controls">
    <button id="arm-button" class="arm" onclick="toggleArm()">ARM</button>
    <button id="settings-button" onclick="openSettings()">SETTINGS</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
